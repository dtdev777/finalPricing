name: finalpricing

x-app: &app
  build: .
  image: finalpricing-app:latest
  init: true
  networks:
    - pricing_net

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pricing_net

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pricing_net

  api:
    <<: *app
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *postgres-env
      OWN_STORE: ${OWN_STORE:-CellphoneS}
      # Optional: without a key the assistant uses rules only.
      OPENAI_TOKEN_API_KEY: ${OPENAI_TOKEN_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The dashboard only talks to the API, so it receives no database credentials.
  dashboard:
    <<: *app
    restart: unless-stopped
    command: streamlit run app/app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true --browser.gatherUsageStats=false
    environment:
      API_BASE_URL: http://api:8000
      OWN_STORE: ${OWN_STORE:-CellphoneS}
      DASHBOARD_REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-60}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

  # One-shot job, started by scripts/run_daily.ps1.
  pipeline:
    <<: *app
    profiles: ["jobs"]
    command: python -m src.pipeline.run_all
    environment:
      <<: *postgres-env
      # crawl_date follows the Vietnamese market, not the host or container clock.
      TZ: Asia/Ho_Chi_Minh
      OWN_STORE: ${OWN_STORE:-CellphoneS}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      MONGO_DB: ${MONGO_DB:?set MONGO_DB in .env}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy

networks:
  pricing_net:
    name: pricing_net

volumes:
  mongo_data:
  postgres_data:
